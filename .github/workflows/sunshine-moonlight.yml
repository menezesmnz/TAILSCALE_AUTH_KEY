name: Windows Cloud PC - Sunshine Moonlight

on:
  workflow_dispatch:

jobs:
  moonlight:
    name: Start Sunshine Moonlight
    runs-on: windows-latest
    timeout-minutes: 10080

    steps:
      - name: Install Tailscale
        shell: powershell
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $url -OutFile $installer

          $process = Start-Process msiexec.exe `
            -ArgumentList "/i", "`"$installer`"", "/quiet", "/norestart" `
            -Wait -PassThru

          Remove-Item $installer -Force -ErrorAction SilentlyContinue

          if ($process.ExitCode -ne 0) {
            throw "Falha ao instalar Tailscale."
          }

      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
            throw "Tailscale não encontrado."
          }

          if (-not $env:TAILSCALE_AUTH_KEY) {
            throw "Secret TAILSCALE_AUTH_KEY não configurado."
          }

          & $tailscale up `
            --authkey="$env:TAILSCALE_AUTH_KEY" `
            --hostname="moonlight-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao conectar ao Tailscale."
          }

          $ip = $null

          for ($i = 1; $i -le 30; $i++) {
            $result = & $tailscale ip -4 2>$null
            $ip = ($result | Select-Object -First 1)

            if ($ip) {
              $ip = $ip.Trim()
              break
            }

            Start-Sleep -Seconds 3
          }

          if (-not $ip) {
            throw "Não foi possível obter IP do Tailscale."
          }

          "TAILSCALE_IP=$ip" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "IP Tailscale: $ip"

      - name: Install Sunshine
        shell: powershell
        run: |
          $url = "https://github.com/LizardByte/Sunshine/releases/latest/download/Sunshine-Windows-AMD64-installer.msi"
          $installer = "$env:TEMP\sunshine.msi"

          Invoke-WebRequest -Uri $url -OutFile $installer

          $process = Start-Process msiexec.exe `
            -ArgumentList "/i", "`"$installer`"", "/quiet", "/norestart" `
            -Wait -PassThru

          Remove-Item $installer -Force -ErrorAction SilentlyContinue

          if ($process.ExitCode -ne 0) {
            throw "Falha ao instalar Sunshine."
          }

      - name: Configure Sunshine CSRF
        shell: powershell
        run: |
          $ip = [string]$env:TAILSCALE_IP

          if ([string]::IsNullOrWhiteSpace($ip)) {
            throw "IP do Tailscale não encontrado."
          }

          $configDir = "$env:ProgramFiles\Sunshine\config"
          $configFile = "$configDir\sunshine.conf"

          New-Item -ItemType Directory `
            -Force `
            -Path $configDir | Out-Null

          $origin = "https://${ip}:47990"

          [string]$content = ""

          if (Test-Path -LiteralPath $configFile) {
            $content = [string](Get-Content `
              -LiteralPath $configFile `
              -Raw `
              -ErrorAction SilentlyContinue)

            if ($null -eq $content) {
              $content = ""
            }
          }

          $content = [regex]::Replace(
            $content,
            '(?m)^\s*csrf_allowed_origins\s*=.*\r?\n?',
            ''
          )

          $content = $content.TrimEnd()

          $content += "`r`ncsrf_allowed_origins = $origin`r`n"

          Set-Content `
            -LiteralPath $configFile `
            -Value $content `
            -Encoding UTF8

          Write-Host "CSRF configurado: $origin"
          Write-Host "Arquivo: $configFile"
          Write-Host ""

          Get-Content -LiteralPath $configFile |
            Select-String -Pattern "csrf_allowed_origins"

          # O instalador pode iniciar o Sunshine automaticamente.
          # Encerrar o processo força o próximo passo a iniciar
          # o Sunshine novamente usando a configuração nova.

          Get-Process sunshine `
            -ErrorAction SilentlyContinue |
            Stop-Process -Force

          Start-Sleep -Seconds 3

          Write-Host "Sunshine encerrado para recarregar a configuração."

      - name: Configure Windows Firewall
        shell: powershell
        run: |
          New-NetFirewallRule `
            -DisplayName "Sunshine TCP" `
            -Direction Inbound `
            -Action Allow `
            -Protocol TCP `
            -LocalPort 47984-47990,48010 `
            -ErrorAction SilentlyContinue

          New-NetFirewallRule `
            -DisplayName "Sunshine UDP" `
            -Direction Inbound `
            -Action Allow `
            -Protocol UDP `
            -LocalPort 47998-48000,48002 `
            -ErrorAction SilentlyContinue

          Write-Host "Firewall configurado."

      - name: Start Sunshine
        shell: powershell
        run: |
          $paths = @(
            "$env:ProgramFiles\Sunshine\sunshine.exe",
            "$env:ProgramFiles\Sunshine\bin\sunshine.exe"
          )

          $sunshine = $paths |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $sunshine) {
            $sunshine = Get-ChildItem `
              -Path "$env:ProgramFiles" `
              -Filter "sunshine.exe" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $sunshine) {
            throw "sunshine.exe não foi encontrado."
          }

          Write-Host "Executável: $sunshine"

          Start-Process -FilePath $sunshine

          Start-Sleep -Seconds 10

          if (-not (Get-Process sunshine `
            -ErrorAction SilentlyContinue)) {
            throw "Sunshine não iniciou."
          }

          Write-Host "Sunshine está rodando."

      - name: Show Connection Information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "       SUNSHINE / MOONLIGHT"
          Write-Host "======================================"
          Write-Host ""
          Write-Host "IP Tailscale:"
          Write-Host "$env:TAILSCALE_IP"
          Write-Host ""
          Write-Host "Adicionar no Moonlight:"
          Write-Host "$env:TAILSCALE_IP"
          Write-Host ""
          Write-Host "Painel Sunshine:"
          Write-Host "https://$env:TAILSCALE_IP`:47990"
          Write-Host ""
          Write-Host "======================================"

      - name: Keep PC Running
        shell: powershell
        run: |
          while ($true) {
            $process = Get-Process sunshine `
              -ErrorAction SilentlyContinue

            if (-not $process) {
              Write-Host "Sunshine parou. Reiniciando..."

              $paths = @(
                "$env:ProgramFiles\Sunshine\sunshine.exe",
                "$env:ProgramFiles\Sunshine\bin\sunshine.exe"
              )

              $sunshine = $paths |
                Where-Object { Test-Path $_ } |
                Select-Object -First 1

              if ($sunshine) {
                Start-Process -FilePath $sunshine
              }
            }

            Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] Sunshine ativo"

            Start-Sleep -Seconds 300
          }
